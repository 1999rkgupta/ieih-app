# Netlify Configuration (Build from repository root)
[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Route /api/* to Netlify Express Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Route SPA pages to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
